version: 2

sources:
  - name: raw
    description: "Raw application extracts."
    schema: raw
    tables:
      - name: events
        description: "One row per tracked product event."
        loaded_at_field: _loaded_at

models:
  - name: fct_events
    description: "One row per tracked product event."
    columns:
      - name: event_id
        description: "Primary key of the event."
      - name: user_id
        description: "The user the event belongs to."
      - name: event_name
        description: "Name of the tracked event."
      - name: event_ts
        description: "Timestamp the event was recorded."
