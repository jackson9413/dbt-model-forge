version: 2

sources:
  - name: raw
    description: "Raw extracts loaded by the ingestion pipeline."
    schema: raw
    tables:
      - name: orders
        description: "One row per order as written by the checkout service."
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}

models:
  - name: fct_orders
    description: "One row per order. Grain: one row per order_id."
    columns:
      - name: order_id
        description: "Primary key assigned by the checkout service."
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "The customer who placed the order."
        data_tests:
          - not_null
      - name: order_total
        description: "Order total in USD including tax and shipping."
        data_tests:
          - not_null
      - name: order_status
        description: "Lifecycle status of the order."
        data_tests:
          - accepted_values:
              values: ['placed', 'shipped', 'delivered']
      - name: updated_at
        description: "Last time the source row changed."
